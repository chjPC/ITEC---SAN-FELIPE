<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Iniciar sesión - Mi Galería</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        .login-page {
            min-height: calc(100vh - 72px);

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 40px 20px;
        }

        .login-card {
            width: 100%;
            max-width: 430px;

            padding: 40px;

            background: var(--surface);

            border: 1px solid var(--border);

            border-radius: 18px;
        }

        .login-card h1 {
            margin-bottom: 8px;
        }

        .login-card > p {
            color: var(--muted);

            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;

            margin-bottom: 8px;

            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;

            padding: 13px 14px;

            border-radius: 8px;

            border: 1px solid var(--border);

            background: var(--background);

            color: var(--text);

            outline: none;

            font-size: 1rem;
        }

        .form-group input:focus {
            border-color: var(--accent);
        }

        .login-submit {
            width: 100%;

            border: none;

            cursor: pointer;

            font-size: 1rem;
        }

        .back-home {
            display: block;

            margin-top: 25px;

            text-align: center;

            color: var(--muted);

            text-decoration: none;
        }

    </style>

</head>


<body>

    <header class="navbar">

        <div class="logo">
            Mi Galería
        </div>

        <nav>
            <a href="index.html">
                Inicio
            </a>
        </nav>

    </header>


    <main class="login-page">

        <div class="login-card">

            <span class="section-label">
                ACCESO PRIVADO
            </span>

            <h1>
                Bienvenido
            </h1>

            <p>
                Inicia sesión para acceder a tus contenidos.
            </p>


            <form id="login-form">

                <div class="form-group">

                    <label for="email">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="tu@email.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Tu contraseña"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="button primary login-submit"
                >
                    Iniciar sesión
                </button>

            </form>


            <a
                href="index.html"
                class="back-home"
            >
                ← Volver al inicio
            </a>

        </div>

    </main>


    <script src="js/app.js"></script>

</body>

</html>
